<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b1220">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<title>AI 直播助手</title>
<style>
  :root {
    --bg: #0b1220; --card: #151d2e; --card2: #1b2438; --line: #26304a;
    --txt: #e8edf7; --sub: #8b98b5; --accent: #4f8cff; --accent2: #7c5cff;
    --green: #2fbf71; --red: #ff5d5d; --orange: #ffb020;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: system-ui, "Microsoft YaHei", sans-serif; margin: 0; color: var(--txt);
    background: radial-gradient(1200px 600px at 80% -10%, #17244a 0%, var(--bg) 55%);
    min-height: 100vh; padding-bottom: calc(70px + env(safe-area-inset-bottom));
  }
  header {
    padding: calc(12px + env(safe-area-inset-top)) 16px 10px; display: flex; align-items: center; gap: 10px;
  }
  header img { width: 34px; height: 34px; border-radius: 10px; }
  header .title { font-size: 17px; font-weight: 700; flex: 1; }
  .pill { font-size: 12px; padding: 4px 12px; border-radius: 20px; background: #202b45; color: var(--sub); display: flex; align-items: center; gap: 6px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--sub); }
  .dot.on { background: var(--green); box-shadow: 0 0 8px var(--green); animation: pulse 1.6s infinite; }
  @keyframes pulse { 50% { opacity: .4; } }
  main { padding: 4px 14px; max-width: 560px; margin: 0 auto; }
  .page { display: none; } .page.active { display: block; }
  .card {
    background: linear-gradient(180deg, var(--card) 0%, var(--card2) 100%);
    border: 1px solid var(--line); border-radius: 18px; padding: 16px; margin-bottom: 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,.25);
  }
  .card h2 { font-size: 13px; margin: 0 0 12px; color: var(--sub); font-weight: 600; letter-spacing: 1px; }

  /* ---- 首页 hero ---- */
  .hero { text-align: center; padding: 26px 16px 22px; }
  .power {
    width: 108px; height: 108px; border-radius: 50%; margin: 6px auto 14px; border: none; cursor: pointer;
    background: conic-gradient(from 180deg, var(--accent), var(--accent2), var(--accent));
    display: flex; align-items: center; justify-content: center; position: relative; transition: transform .15s;
  }
  .power:active { transform: scale(.94); }
  .power .inner {
    width: 92px; height: 92px; border-radius: 50%; background: var(--card2);
    display: flex; align-items: center; justify-content: center; font-size: 34px;
  }
  .power.running { animation: glow 2s infinite; }
  @keyframes glow { 0%,100% { box-shadow: 0 0 18px rgba(79,140,255,.35);} 50% { box-shadow: 0 0 42px rgba(124,92,255,.7);} }
  .state-txt { font-size: 20px; font-weight: 700; }
  .state-sub { font-size: 12px; color: var(--sub); margin-top: 4px; min-height: 16px; }
  .state-sub.err { color: var(--red); }
  .counters { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 14px; }
  .counters .c { background: #101828; border: 1px solid var(--line); border-radius: 12px; padding: 10px 2px; }
  .counters .c b { display: block; font-size: 11px; color: var(--sub); font-weight: normal; }
  .counters .c span { font-size: 17px; font-weight: 700; }
  .row { display: flex; gap: 10px; align-items: center; margin: 10px 0; }
  input[type=text], input[type=password], select {
    flex: 1; min-width: 0; padding: 12px; font-size: 15px; border: 1px solid var(--line);
    border-radius: 12px; background: #101828; color: var(--txt); outline: none;
  }
  input:focus { border-color: var(--accent); }
  button { border: none; border-radius: 12px; padding: 12px 18px; font-size: 15px; cursor: pointer;
    background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; font-weight: 600; }
  button.gray { background: #2a3650; } button.green { background: linear-gradient(135deg, #23b26b, #2fbf71); }
  .switch-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .switch-row:last-child { border-bottom: none; }
  .switch-row .lab { font-size: 14px; } .switch-row .lab small { display: block; color: var(--sub); font-size: 11px; margin-top: 2px; }
  .tgl { position: relative; width: 46px; height: 26px; flex: none; }
  .tgl input { opacity: 0; width: 0; height: 0; }
  .tgl .knob { position: absolute; inset: 0; background: #2a3650; border-radius: 20px; transition: .2s; }
  .tgl .knob::after { content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #8b98b5; transition: .2s; }
  .tgl input:checked + .knob { background: var(--accent); }
  .tgl input:checked + .knob::after { left: 23px; background: #fff; }

  /* ---- 均衡器 ---- */
  #eq { display: none; gap: 3px; align-items: flex-end; height: 18px; margin: 0 auto; width: max-content; }
  #eq.on { display: flex; }
  #eq i { width: 4px; background: linear-gradient(180deg, var(--accent2), var(--accent)); border-radius: 2px; animation: eq 0.9s infinite ease-in-out; }
  #eq i:nth-child(2) { animation-delay: .15s; } #eq i:nth-child(3) { animation-delay: .3s; }
  #eq i:nth-child(4) { animation-delay: .45s; } #eq i:nth-child(5) { animation-delay: .6s; }
  @keyframes eq { 0%,100% { height: 5px; } 50% { height: 18px; } }

  /* ---- 消息 ---- */
  .chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; }
  .chip { flex: none; font-size: 12px; padding: 6px 13px; border-radius: 16px; background: #101828; color: var(--sub); border: 1px solid var(--line); cursor: pointer; }
  .chip.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  #msgs { height: 56vh; overflow-y: auto; scrollbar-width: none; }
  #msgs::-webkit-scrollbar, .chips::-webkit-scrollbar { display: none; }
  .chips { scrollbar-width: none; }
  .msg { padding: 9px 2px; border-bottom: 1px solid #1c2537; font-size: 14px; line-height: 1.5; }
  .msg .cat { display: inline-block; font-size: 10px; padding: 1px 7px; border-radius: 8px; margin-right: 6px; vertical-align: 1px; }
  .cat.chat { background: #17305c; color: #7fb0ff; } .cat.gift { background: #4a3413; color: #ffc86b; }
  .cat.enter { background: #16324a; color: #6fd3ff; } .cat.follow { background: #3b1b4d; color: #d29bff; }
  .cat.like { background: #4d1b2c; color: #ff8fa8; } .cat.fanclub { background: #14402f; color: #7fe0ae; }
  .cat.cast { background: #333a4d; color: #b9c3da; }
  .msg .u { font-weight: 700; margin-right: 6px; }
  .msg .ai { display: block; color: var(--green); margin-top: 3px; font-size: 13px; }
  .msg .note { display: block; color: var(--orange); margin-top: 3px; font-size: 12px; }
  .msg .t { float: right; color: var(--sub); font-size: 11px; }

  /* ---- 话术 ---- */
  .quick { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .quick button { background: #101828; border: 1px solid var(--line); color: var(--txt); font-size: 13px; padding: 14px 8px; font-weight: 500; }
  .quick button:active { border-color: var(--accent); }

  /* ---- 底部导航 ---- */
  nav.bottom {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 9;
    display: flex; background: rgba(13,19,33,.92); backdrop-filter: blur(12px);
    border-top: 1px solid var(--line); padding: 6px 0 env(safe-area-inset-bottom);
  }
  nav.bottom button {
    flex: 1; background: none; color: var(--sub); font-size: 11px; padding: 6px 0 2px; font-weight: 500;
  }
  nav.bottom button .ico { display: block; font-size: 20px; margin-bottom: 2px; }
  nav.bottom button.on { color: var(--accent); }
  .hint { font-size: 12px; color: var(--sub); margin: 6px 0 0; line-height: 1.6; }
  a.link { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>
<header>
  <img src="/icons/icon-192.png" alt="">
  <div class="title">AI 直播助手</div>
  <div class="pill"><span class="dot" id="hdrDot"></span><span id="hdrState">未连接</span></div>
</header>
<main>

<!-- ===== 首页 ===== -->
<section class="page active" id="page-home">
  <div class="card hero">
    <button class="power" id="power" onclick="toggleListen()"><span class="inner">▶</span></button>
    <div class="state-txt" id="stateTxt">未连接</div>
    <div class="state-sub" id="ctrlMsg">点击开始监听直播间弹幕</div>
    <div class="counters">
      <div class="c"><b>弹幕</b><span id="cDanmu">0</span></div>
      <div class="c"><b>进场</b><span id="cEnter">0</span></div>
      <div class="c"><b>礼物</b><span id="cGift">0</span></div>
      <div class="c"><b>点赞</b><span id="cLike">0</span></div>
    </div>
  </div>
  <div class="card">
    <div id="eq"><i></i><i></i><i></i><i></i><i></i></div>
    <div class="row" style="margin-top:8px">
      <select id="platform" style="max-width:120px">
        <option value="bilibili">B 站</option>
        <option value="douyin">抖音</option>
      </select>
      <input type="text" id="room" placeholder="直播间 ID">
    </div>
  </div>
</section>

<!-- ===== 消息 ===== -->
<section class="page" id="page-msgs">
  <div class="card">
    <div class="chips" id="chips">
      <span class="chip on" data-f="all">全部</span>
      <span class="chip" data-f="chat">聊天</span>
      <span class="chip" data-f="gift">礼物</span>
      <span class="chip" data-f="enter">进场</span>
      <span class="chip" data-f="follow">关注</span>
      <span class="chip" data-f="like">点赞</span>
      <span class="chip" data-f="fanclub">粉丝团</span>
      <span class="chip" data-f="cast">播报</span>
    </div>
    <div id="msgs"></div>
  </div>
</section>

<!-- ===== 话术 ===== -->
<section class="page" id="page-speak">
  <div class="card">
    <h2>常用话术 · 一键让主播说</h2>
    <div class="quick">
      <button onclick="speak('欢迎大家来到直播间，喜欢主播的点个关注')">欢迎+关注</button>
      <button onclick="speak('感谢大家的礼物和点赞，你们是最棒的')">感谢礼物</button>
      <button onclick="speak('想听歌的朋友可以发弹幕点歌哦')">引导点歌</button>
      <button onclick="speak('马上为大家带来精彩内容，不要走开')">留住观众</button>
    </div>
    <h2>自定义话术</h2>
    <div class="row">
      <input type="text" id="speakText" placeholder="输入内容…">
      <button class="green" onclick="speak($('speakText').value.trim(), true)">说话</button>
    </div>
  </div>
</section>

<!-- ===== 设置 ===== -->
<section class="page" id="page-set">
  <div class="card">
    <h2>直播开关</h2>
    <div class="switch-row">
      <div class="lab">AI 回复<small>关闭后弹幕只展示不回复</small></div>
      <label class="tgl"><input type="checkbox" id="aiToggle" checked onchange="toggleAI(this.checked)"><span class="knob"></span></label>
    </div>
    <div class="switch-row">
      <div class="lab">播放主播语音<small>手机实时播出 AI 说话的声音</small></div>
      <label class="tgl"><input type="checkbox" id="soundOn" checked><span class="knob"></span></label>
    </div>
  </div>
  <div class="card">
    <h2>连接</h2>
    <p class="hint" style="margin-top:0">
      手机与电脑需在同一局域网，服务端 host 需改为 <code>0.0.0.0</code>。<br>
      浏览器菜单「添加到主屏幕」即可像 App 一样全屏使用。<br>
      完整功能（关键词/过滤/备份等）请用电脑端：<a class="link" href="/" target="_blank">打开控制台</a>
    </p>
  </div>
</section>

</main>

<nav class="bottom">
  <button class="on" data-p="home" onclick="go(this)"><span class="ico">🏠</span>首页</button>
  <button data-p="msgs" onclick="go(this)"><span class="ico">💬</span>消息</button>
  <button data-p="speak" onclick="go(this)"><span class="ico">🎙️</span>话术</button>
  <button data-p="set" onclick="go(this)"><span class="ico">⚙️</span>设置</button>
</nav>

<audio id="player" autoplay></audio>

<script>
const $ = id => document.getElementById(id);
const player = $('player');
let ws = null, wsRetry = 0, listening = false;

/* Tab 切换 */
function go(btn) {
  document.querySelectorAll('nav.bottom button').forEach(b => b.classList.toggle('on', b === btn));
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  $('page-' + btn.dataset.p).classList.add('active');
}

/* 手机浏览器要求用户先交互才能出声 */
function unlockAudio() {
  player.play().then(() => player.pause()).catch(() => {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const src = ctx.createBufferSource();
      src.buffer = ctx.createBuffer(1, 1, 22050); src.connect(ctx.destination); src.start(0);
    } catch (e) {}
  });
  document.removeEventListener('click', unlockAudio);
}
document.addEventListener('click', unlockAudio);

player.onplay = () => $('eq').classList.add('on');
player.onended = player.onpause = () => $('eq').classList.remove('on');
function play(url) { if (!url || !$('soundOn').checked) return; player.src = url; player.play().catch(() => {}); }

/* 消息流 */
const CAT = { chat: ['聊天', 'chat'], welcome: ['进场', 'enter'], gift_thanks: ['礼物', 'gift'],
              like_thanks: ['点赞', 'like'], follow_thanks: ['关注', 'follow'],
              fanclub: ['粉丝团', 'fanclub'], like: ['点赞', 'like'] };
const NOTE = { blocked: '拦截', ratelimited: '限流', skipped: '丢弃', filtered: '已过滤' };
let curFilter = 'all';

function addMsg(cat, user, content, ai, note, ts) {
  const d = document.createElement('div');
  d.className = 'msg'; d.dataset.cat = cat;
  d.innerHTML = `<span class="t">${ts || ''}</span><span class="cat ${cat}">${catName(cat)}</span>` +
    `<span class="u">${esc(user)}</span>${esc(content)}` +
    (ai ? `<span class="ai">🔊 ${esc(ai)}</span>` : '') +
    (note ? `<span class="note">⚠ ${esc(note)}</span>` : '');
  const box = $('msgs');
  box.appendChild(d);
  while (box.children.length > 300) box.removeChild(box.firstChild);
  if (curFilter === 'all' || curFilter === cat) d.style.display = '';
  else d.style.display = 'none';
  box.scrollTop = box.scrollHeight;
}
function catName(c) { return { chat:'聊天', gift:'礼物', enter:'进场', follow:'关注', like:'点赞', fanclub:'粉丝团', cast:'播报' }[c] || c; }
function esc(s) { const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; }

document.querySelectorAll('.chip').forEach(ch => ch.onclick = () => {
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('on'));
  ch.classList.add('on'); curFilter = ch.dataset.f;
  document.querySelectorAll('#msgs .msg').forEach(m =>
    m.style.display = (curFilter === 'all' || m.dataset.cat === curFilter) ? '' : 'none');
});

function connectWs() {
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen = () => { wsRetry = 0; };
  ws.onclose = () => setTimeout(connectWs, Math.min(1000 * 2 ** wsRetry++, 15000));
  ws.onmessage = ev => {
    const m = JSON.parse(ev.data);
    const ts = new Date().toTimeString().slice(0, 5);
    if (m.type === 'status') { setUI(m.running, m.platform, m.room_id); return; }
    if (m.type === 'ai_reply') { $('aiToggle').checked = m.enabled; return; }
    if (m.type === 'reply') {
      addMsg('chat', m.username, m.question, (m.source === 'keyword' ? '[关键词] ' : '') + m.text, '', ts);
      play(m.audio_url); return;
    }
    if (NOTE[m.type]) {
      addMsg('chat', m.username, m.text || '', '', `${NOTE[m.type]}：${m.reason || (m.wait ? `需等待 ${m.wait}s` : '')}`, ts);
      return;
    }
    if (CAT[m.type]) { addMsg(CAT[m.type][1], m.username, m.text || m.content || '', '', '', ts); play(m.audio_url); return; }
    if (m.type === 'song_play') { play(m.audio_url); addMsg('cast', m.username, '♪ ' + m.text, '', '', ts); return; }
    if (m.text) { addMsg('cast', m.username || '系统', m.text, '', '', ts); play(m.audio_url); }
  };
}

async function post(url, body) {
  const r = await fetch(url, { method: 'POST',
    headers: body ? { 'Content-Type': 'application/json' } : {},
    body: body ? JSON.stringify(body) : undefined });
  return r.json();
}

function setUI(running, platform, room, msg, isError) {
  listening = running;
  $('power').classList.toggle('running', running);
  $('power').querySelector('.inner').textContent = running ? '⏹' : '▶';
  $('stateTxt').textContent = running ? '直播监听中' : '未连接';
  $('hdrState').textContent = running ? `${platform || ''} ${room ?? ''}` : '未连接';
  $('hdrDot').classList.toggle('on', running);
  if (msg !== undefined) {
    $('ctrlMsg').textContent = msg || (running ? '' : '点击开始监听直播间弹幕');
    $('ctrlMsg').classList.toggle('err', !!isError);
  }
}

async function toggleListen() {
  unlockAudio();
  $('power').disabled = true;
  try {
    if (listening) {
      setUI(false, '', '', '正在停止…');
      await post('/api/stop', null);
      setUI(false, '', '', '已停止监听');
    } else {
      const platform = $('platform').value;
      const room = $('room').value.trim();
      setUI(true, platform, room || '…', '连接中…');
      const r = await post('/api/start', { room_id: room || null, platform });
      if (r.ok) setUI(true, platform, room, '已连接，开始接收弹幕');
      else setUI(false, platform, room, '启动失败：' + (r.error || ''), true);
    }
  } finally { $('power').disabled = false; poll(); }
}

async function toggleAI(enabled) { await post('/api/ai_reply', { enabled }); }
async function speak(text, clear) {
  if (!text) return;
  if (await post('/api/speak', { text })) { if (clear) $('speakText').value = ''; }
}

async function poll() {
  try {
    const s = await (await fetch('/api/console/status')).json();
    $('cDanmu').textContent = s.counters.danmu; $('cEnter').textContent = s.counters.enter;
    $('cGift').textContent = s.counters.gift; $('cLike').textContent = s.counters.like;
    $('aiToggle').checked = s.ai_reply_enabled;
    if (s.running !== listening) setUI(s.running, s.platform, $('room').value, '');
  } catch (e) { setUI(false, '', '', '无法连接服务，请检查网络', true); }
}
setInterval(poll, 5000);

/* 初始化 */
(async function init() {
  connectWs(); poll();
  try {
    const cfg = await (await fetch('/api/settings')).json();
    const rid = cfg.platform === 'douyin' ? cfg.douyin?.room_id : cfg.bilibili?.room_id;
    if (rid) { $('room').value = rid; $('platform').value = cfg.platform || 'bilibili'; }
    const h = await (await fetch('/api/messages?limit=50')).json();
    (h.messages || []).slice().reverse().forEach(m => addMsg(m.type, m.username, m.content, m.ai_reply));
  } catch (e) { /* 忽略 */ }
})();
</script>
</body>
</html>
