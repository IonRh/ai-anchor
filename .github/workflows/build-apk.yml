name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths: ["android-app/**"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"

      - name: Sync mobile page into APK assets
        run: |
          mkdir -p android-app/app/src/main/assets
          cp static/mobile.html android-app/app/src/main/assets/mobile.html

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle -p android-app assembleDebug --no-daemon 2>&1 | tee build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-anchor-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk

      - name: Report errors back to repo
        if: failure()
        run: |
          grep -aE "^(e: |error: |FAILURE|\\* What went wrong)" build.log | head -40 > error-summary.txt
          if [ ! -s error-summary.txt ]; then tail -60 build.log > error-summary.txt; fi
          git config user.name "build-bot"
          git config user.email "bot@users.noreply.github.com"
          git add error-summary.txt
          git commit -m "BUILD ERROR REPORT (auto)"
          git push
